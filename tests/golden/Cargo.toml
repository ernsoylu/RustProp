[package]
name = "rustprop-golden-tests"
description = "Golden-fixture harness and tests comparing rustprop against upstream CoolProp 8.0.0"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustprop = { workspace = true, features = ["if97"] }
rustprop-core.workspace = true
rustprop-data = { workspace = true, features = [
    "water",
    "nitrogen",
    "carbondioxide",
    "r134a",
    "n_propane",
    "ammonia",
] }
rustprop-heos.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
