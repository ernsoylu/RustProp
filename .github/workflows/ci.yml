name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly all-fluids sweep (Mondays 04:17 UTC)

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup auto-installs the toolchain pinned in rust-toolchain.toml,
      # including the wasm32-unknown-unknown target and clippy/rustfmt.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Generated fluid data can never drift from the generator + pinned JSON
      - name: datagen determinism
        run: |
          cargo run -q -p rustprop-datagen
          git diff --exit-code
      - run: cargo build -p rustprop --features all-backends --target wasm32-unknown-unknown --release
      - run: cargo run -p rustprop-cli -- props T P 101325 Q 0 IF97::Water
      - name: wasm size report
        run: |
          echo "### wasm size report (rustprop-wasm-size-probe, release)"
          for feats in "" if97 heos-water heos-all-fluids cubics incompressible humid-air all-backends; do
            if [ -n "$feats" ]; then
              cargo build -q -p rustprop-wasm-size-probe --target wasm32-unknown-unknown --release --features "$feats"
            else
              cargo build -q -p rustprop-wasm-size-probe --target wasm32-unknown-unknown --release
            fi
            printf '%-14s %10s bytes\n' "${feats:-minimal}" \
              "$(stat -c %s target/wasm32-unknown-unknown/release/rustprop_wasm_size_probe.wasm)"
          done

  # All-fluids sweep: the #[ignore]d 130-fluid smoke suite (~1,900 oracle
  # records). Runs on manual dispatch and weekly — not on every push.
  sweep:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustprop-golden-tests --test heos_all_smoke -- --ignored --nocapture
