name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly all-fluids sweep (Mondays 04:17 UTC)

# Third-party actions are pinned by commit SHA, not by tag. A tag like `@v4` is
# a mutable pointer: whoever controls the action repository can move it, and
# these workflows run with a token that can write to this repository — and, in
# release.yml's case, will hold the crates.io publish token. The trailing
# comment records which tag the SHA was resolved from, so the pin stays
# readable. To update one deliberately:
#
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
# Note the pins are what `@v4`-style tags pointed at on 2026-08-21; several of
# these actions have much newer majors, and moving to them is a separate change
# with its own verification.

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rustup auto-installs the toolchain from rust-toolchain.toml (which
      # floats on the stable channel — it is not pinned to a version),
      # including the wasm32-unknown-unknown target and clippy/rustfmt.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Generated fluid data can never drift from the generator + pinned JSON
      - name: datagen determinism
        run: |
          cargo run -q -p rustprop-datagen
          git diff --exit-code
      - run: cargo build -p rustprop --features all-backends --target wasm32-unknown-unknown --release
      - run: cargo run -p rustprop-cli -- props T P 101325 Q 0 IF97::Water
      # The JS deliverable: build it, then check it from Node against the
      # same oracle fixtures the Rust suite uses.
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.13.1"
      - name: wasm-pack build + Node smoke
        run: |
          wasm-pack build crates/rustprop-wasm --target nodejs --out-dir pkg-node \
            --features if97,heos,water,humid-air
          node tests/wasm-smoke/smoke.mjs
      # Catches publishing metadata problems on every push, long before a
      # tag makes them irreversible. --workspace resolves the ordering and
      # verifies each crate against the local ones.
      - run: cargo publish --dry-run --workspace
      - name: wasm size report
        run: |
          echo "### wasm size report (rustprop-wasm-size-probe, release)"
          for feats in "" if97 heos-water heos-all-fluids heos-mixtures cubics incompressible humid-air svdsbtl all-backends; do
            if [ -n "$feats" ]; then
              cargo build -q -p rustprop-wasm-size-probe --target wasm32-unknown-unknown --release --features "$feats"
            else
              cargo build -q -p rustprop-wasm-size-probe --target wasm32-unknown-unknown --release
            fi
            printf '%-14s %10s bytes\n' "${feats:-minimal}" \
              "$(stat -c %s target/wasm32-unknown-unknown/release/rustprop_wasm_size_probe.wasm)"
          done

  # The C/C++ deliverable, on every push.
  #
  # WHY IT IS NOT PART OF THE `ci` JOB. `cargo test` cannot check this. The
  # header is hand-written, so what keeps it agreeing with `src/lib.rs` is a C
  # translation unit compiled against it and linked to the real artifact —
  # and what keeps the generated pkg-config and CMake files honest is a
  # downstream project built out of the packaged tree. Both need a C
  # toolchain, a linker and a package manager, none of which `cargo test`
  # touches. Everything below therefore runs the same scripts a contributor
  # runs locally, so a red build here is reproducible in one command.
  capi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The Rust-side unit tests, at BOTH extremes of the feature set. The
      # extremes are the point: `all-backends` exercises the calculation
      # paths, while a build with no engines at all is the only place the
      # RUSTPROP_UNAVAILABLE contract — every symbol exported by every build —
      # can actually be tested, because the tests for it are `cfg(not(...))`.
      - run: cargo test -p rustprop-capi --features all-backends
      - run: cargo test -p rustprop-capi
      # Two single-engine builds, because they are what a size-conscious
      # consumer actually compiles and each one gates a different half of the
      # exported surface.
      - run: cargo test -p rustprop-capi --features if97
      - run: cargo test -p rustprop-capi --features humid-air

      - run: cargo clippy -p rustprop-capi --all-targets --all-features -- -D warnings

      # C and C++, shared and static, against the built library — plus the
      # check that every symbol the header declares is really exported.
      - name: C and C++ link and run
        run: crates/rustprop-capi/ctest.sh all-backends

      # Then package it and build four downstream consumers out of the
      # extracted tree: two through pkg-config, two through CMake
      # find_package, static and shared each. The generated .pc and CMake
      # config are the files most likely to be quietly wrong.
      - name: package and consume
        run: |
          set -euo pipefail
          export RUSTPROP_NATIVE_LIBS="$(cargo rustc -p rustprop-capi \
            --features all-backends --profile release-capi --crate-type staticlib -- \
            --print native-static-libs 2>&1 \
            | sed -n 's/^note: native-static-libs: //p' | tail -1)"
          dir="$(crates/rustprop-capi/package.sh x86_64-unknown-linux-gnu dist all-backends)"
          crates/rustprop-capi/consumer-test.sh "$dir"

      # The language bindings USAGE.md documents. FFI documentation drifts
      # silently and expensively — a wrong ctypes `argtypes` line does not
      # fail loudly, it passes garbage to a solver and returns a plausible
      # number — so each binding is a real program checking real values, and
      # this runs them.
      #
      # gfortran is not on the runner image by default. Java is: but FFM only
      # became stable in 22 and the image ships 17/21, so the script SKIPS
      # Java here and reports it. That binding is exercised locally (JDK 26);
      # pulling a newer JDK would mean another third-party action to pin, for
      # one example, and is not worth it.
      - name: install binding toolchains
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gfortran
      - name: language bindings (Python, Go, Java, Fortran)
        run: crates/rustprop-capi/bindings-test.sh all-backends

      # A shared library that exports more than it means to is a maintenance
      # liability: every accidental symbol is one somebody can come to depend
      # on. The header declares twelve functions; the library should export
      # those and no other `rustprop_*` name.
      - name: no unintended exports
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^RUSTPROP_API [^(]* \**\(rustprop_[a-z0-9_]*\)(.*/\1/p' \
            crates/rustprop-capi/include/rustprop.h | sort -u)"
          exported="$(nm -D --defined-only target/release-capi/librustprop.so \
            | awk '$2 == "T" {print $3}' | grep '^rustprop_' | sort -u)"
          if ! diff <(echo "$declared") <(echo "$exported"); then
            echo "::error::the header and the library disagree about the exported surface (< header, > library)"
            exit 1
          fi
          echo "exported surface matches the header exactly ($(echo "$declared" | wc -l) functions)"

  # Off-Linux platform tests.
  #
  # WHY THIS JOB EXISTS. Until it landed, every number this port has ever been
  # checked against was computed on Linux/x86-64, while `release.yml` ships CLI
  # binaries for macOS-arm64 and Windows-x64 that no test had ever touched. A
  # build-only matrix cannot catch the risk that actually matters here: the
  # suite asserts agreement with the CoolProp 8.0.0 oracle at 1e-12 and tighter
  # (much of it bitwise), and the libm a platform links — Apple's, MSVC's,
  # glibc's — is free to return different last bits for exp/log/pow/sin, which
  # every Helmholtz term and every solver iterate is built out of. That
  # divergence is invisible to a compile.
  #
  # WHY THIS SUBSET. `cargo test --workspace --all-features` is exactly the
  # golden suites and nothing else: the six heavy sweeps are `#[ignore]`d, so
  # the default set skips them by construction. That is the right trade — the
  # goldens are hand-placed at the states where agreement is hard (critical
  # region, saturation edges, phase boundaries), while the seeded sweeps are
  # randomized draws whose value is breadth on a platform already covered
  # weekly. Adding them here would multiply runner minutes for redundant
  # coverage. If a platform break ever shows up, widen THIS job.
  #
  # WHY BOTH PROFILES ON MAIN. debug and release are the two gates the project
  # actually enforces (`ci.yml` runs debug, `release.yml`'s verify job runs
  # `--release`), and they have already disagreed once — `heos_pt` asserted
  # bitwise on a PT density the two profiles round 42 ulp apart (`d5a7331`).
  # Pull requests run debug only, to keep the feedback loop cheap.
  #
  # NOT VERIFIED LOCALLY: this job has never executed. It was written on a
  # Linux box that cannot run a macOS or Windows runner, so a first-run failure
  # here is INFORMATION, not necessarily a defect in the workflow — read the
  # failing assertion before assuming the YAML is wrong.
  platform:
    strategy:
      fail-fast: false # a macOS break and a Windows break are separate facts
      matrix:
        include:
          - os: macos-latest # aarch64-apple-darwin, as release.yml ships
          - os: windows-latest # x86_64-pc-windows-msvc, as release.yml ships
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # --no-fail-fast, unlike the `ci` job: cargo otherwise stops at the FIRST
      # failing test binary, and off-Linux divergences are independent facts
      # scattered across suites. The first run of this job proved the cost —
      # macOS stopped at `pseudo_pure` and never reached `validity`, Windows
      # stopped at `validity` and never reached `viscosity`, so neither host
      # reported what it actually disagreed about until a second round. Same
      # reasoning as `fail-fast: false` on the matrix above.
      - name: golden suites (debug)
        run: cargo test --workspace --all-features --no-fail-fast
      - name: golden suites (release)
        if: github.event_name != 'pull_request'
        run: cargo test --workspace --all-features --release --no-fail-fast
      # The CLI is the one deliverable release.yml builds for these two
      # platforms. Run the binary, not just its crate's tests.
      - name: CLI smoke
        run: cargo run -p rustprop-cli -- props T P 101325 Q 0 IF97::Water

  # Supply-chain gate: licences and RustSec advisories over the whole graph.
  #
  # cargo-deny is installed from its own release tarball, pinned by version AND
  # sha256, rather than through `EmbarkStudios/cargo-deny-action` — a gate whose
  # job is to police what the project trusts should not itself pull an unpinned
  # Docker action. The digest below is the one the release publishes alongside
  # the tarball, and it is the exact binary whose verdict was reproduced
  # locally (advisories ok, bans ok, licenses ok, sources ok). Bumping the
  # version means bumping the digest in the same edit.
  supply-chain:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install cargo-deny (pinned)
        run: |
          set -euo pipefail
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" --strip-components=1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          ./cargo-deny --version
      # Config and rationale live in deny.toml. NEVER silence a finding here to
      # make the gate green — upgrade, or record the decision in PLAN.md.
      - run: ./cargo-deny --workspace --all-features check

  # Safety and memory gates for the classes the 2026-08-30 audit found.
  #
  # WHY THIS JOB EXISTS. The `ci` job already runs the new regression suites,
  # because `cargo test --workspace --all-features` picks them up. What it
  # cannot give them is DEPTH or the profiles and targets where these defects
  # actually live, and every one of them was invisible to the default gate:
  #
  #   * The `.svds` reader turned a 24-byte header into a 16 GB reservation.
  #     Nothing in the golden fixtures feeds the reader a malformed blob —
  #     fixtures are all well-formed by construction — so no suite looked.
  #   * `nx * rank` overflows only where `usize` is 32 bits. On x86-64 the
  #     product cannot overflow, so a Linux-only gate can never see it, and
  #     wasm32 — the primary target — is exactly where it bites.
  #   * `bisect_bits`' bracket assertion fired on a non-finite request. It is
  #     a `debug_assert!`, so the release gate compiles it out and only a
  #     DEBUG sweep can reach it.
  #   * The HS legacy leg answered with a state that did not reproduce its own
  #     inputs. Correct on every golden; wrong just off the fixture grid.
  #
  # The numbers below are TARGETS THIS GATE HOLDS, not floors to relax when
  # the job goes red. A regression here is a defect until proven otherwise —
  # if a sweep depth genuinely needs to come down for runner minutes, say so
  # in PLAN.md's Decisions log rather than editing the number quietly.
  safety:
    runs-on: ubuntu-latest
    env:
      # Seeded sweep depth. Release buys breadth cheaply; debug is slower per
      # call but carries `overflow-checks`, which is the only way arithmetic
      # that wraps silently in the shipped profile shows up at all.
      FUZZ_N_RELEASE: "100000"
      FUZZ_N_DEBUG: "25000"
      # Humid air is cheap per call, so it gets a much deeper draw.
      FUZZ_N_HA: "1000000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Malformed-input handling for the one hand-rolled parser in the tree,
      # and the degenerate-slice guards on the tabular bisections.
      - name: reader and bisection hardening
        run: cargo test -p rustprop-svdsbtl -p rustprop-tabular --all-features

      # Release, because both budgets in this suite are profile-sensitive: a
      # debug build is slow enough to blur the four-orders-of-magnitude gap
      # between the cascade and the legacy leg that the budget separates.
      - name: HS flash validity and time budgets
        run: cargo test -p rustprop --features all-backends --release --test hs_flash_validity

      # `props_si` must not panic: the release profile is `panic = "abort"`
      # and the target is wasm32, so a panic is not a catchable JS exception,
      # it is a dead module.
      - name: panic sweep (release, depth)
        run: |
          FUZZ_N="$FUZZ_N_RELEASE" \
            cargo test -p rustprop --features all-backends --release \
              --test props_si_panic_sweep

      - name: panic sweep (debug, overflow-checks + debug_assert)
        run: |
          FUZZ_N="$FUZZ_N_DEBUG" \
            cargo test -p rustprop --features all-backends \
              --test props_si_panic_sweep

      # The OTHER public entry point. The audit's own sweep covered only
      # `props_si`, which was a gap in its coverage rather than a finding.
      # Psychrometrics has no Helmholtz cascade, so a much larger draw count
      # costs almost nothing — 2M draws run in ~7 s and resolve ~250k real
      # solves.
      - name: humid-air panic sweep (both profiles)
        run: |
          FUZZ_N="$FUZZ_N_HA" \
            cargo test -p rustprop --features all-backends \
              --test ha_props_si_panic_sweep
          FUZZ_N="$FUZZ_N_HA" \
            cargo test -p rustprop --features all-backends --release \
              --test ha_props_si_panic_sweep

      # 32-BIT TARGET. This is the point of the job that no other gate covers.
      # `wasm32-unknown-unknown` has no test runner here, but it shares the
      # property that matters — a 32-bit `usize` — with i686, which DOES run
      # natively on this runner. Any `nx * rank`-shaped overflow in the reader
      # is reachable here and nowhere else in CI.
      - name: 32-bit target (usize is 32 bits, as on wasm32)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib
          rustup target add i686-unknown-linux-gnu
          cargo test -p rustprop-svdsbtl -p rustprop-tabular --all-features \
            --target i686-unknown-linux-gnu

      # The shipped profile has `overflow-checks` off, so arithmetic that
      # wraps there is silent. Running the release-shaped build WITH the
      # checks on turns that silence into a failure.
      - name: release profile with overflow checks
        env:
          RUSTFLAGS: "-C overflow-checks=on"
        run: cargo test --workspace --all-features --release

      # NOTE no wasm32 build step here: the `ci` job already builds
      # `-p rustprop --features all-backends` for wasm32-unknown-unknown, and
      # `all-backends` includes svdsbtl. What that job cannot do is RUN
      # anything on a 32-bit target, which is what the i686 step above is for.

  # The declared rust-version must actually build the shipped crates —
  # rust-toolchain.toml floats on stable, so nothing else exercises it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +1.88 check -p rustprop --features all-backends
      - run: cargo +1.88 check -p rustprop-wasm --features all-backends
      - run: cargo +1.88 check -p rustprop-capi --features all-backends

  # All-fluids sweep: the #[ignore]d 130-fluid smoke suite (~1,900 oracle
  # records). Runs on manual dispatch and weekly — not on every push.
  sweep:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p rustprop-golden-tests --test heos_all_smoke -- --ignored --nocapture
      - run: cargo test --release -p rustprop-golden-tests --test mixtures mixture_sweep -- --ignored --nocapture
      - run: cargo test --release -p rustprop-golden-tests --test tabular_state tabular_pairs -- --ignored --nocapture
      # The final acceptance suite: a seeded randomized sweep across every
      # engine (PLAN.md 15.3), extended 2026-08 with mixtures/blends, wide
      # outputs, IF97 flash pairs, PC-SAFT Z and pseudo-pure transport.
      - run: cargo test --release -p rustprop-golden-tests --test acceptance -- --ignored --nocapture
      # Low-level acceptance: randomized Tabular draws (four ~100 s table
      # builds) and SVDSBTL surface evals (fast; #[ignore]d for family
      # symmetry only).
      - run: cargo test --release -p rustprop-golden-tests --test acceptance_tabular -- --ignored --nocapture
      - run: cargo test --release -p rustprop-golden-tests --test acceptance_svdsbtl -- --ignored --nocapture

  # Keeps the `sweep` schedule from dying quietly.
  #
  # GitHub DISABLES a scheduled workflow after 60 days without repository
  # activity, and this project is finished: months can pass between pushes. The
  # failure mode is the bad kind — the weekly sweep simply stops running, the
  # six heavy suites stop being checked, and nothing anywhere turns red. The
  # only signal GitHub sends is one email to the last person who touched the
  # workflow file, at the moment it disables.
  #
  # So this job turns silence into a red build while the schedule is still
  # alive: it warns at 30 days of inactivity and FAILS at 45, both of which
  # land with 15+ days of margin before the 60-day cutoff. Deliberately no
  # dummy-commit trick (the usual keepalive) — a bot committing to main to
  # fool an activity counter is worse than an alarm that asks a human for a
  # push. Any push to any branch resets the clock; so does re-enabling the
  # workflow by hand from the Actions tab.
  #
  # NOT VERIFIED LOCALLY: never executed. `pushed_at` and the arithmetic are
  # inspectable, but the 60-day GitHub behaviour is documented, not measured.
  schedule-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: warn before GitHub disables the weekly sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pushed_at="$(gh api "repos/${REPO}" --jq .pushed_at)"
          days=$(( ( $(date -u +%s) - $(date -u -d "$pushed_at" +%s) ) / 86400 ))
          echo "last push to ${REPO}: ${pushed_at} (${days} days ago)"
          if [ "$days" -ge 45 ]; then
            echo "::error::${days} days since the last push. GitHub disables scheduled workflows at 60 days of inactivity, which would silently stop the weekly sweep over the six heavy suites. Push anything to main (or re-enable CI from the Actions tab) to reset the clock."
            exit 1
          fi
          if [ "$days" -ge 30 ]; then
            echo "::warning::${days} days since the last push; this job fails at 45 and GitHub disables the schedule at 60."
          fi
