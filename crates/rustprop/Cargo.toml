[package]
name = "rustprop"
description = "Pure-Rust port of CoolProp 8 with modular, WASM-minimal calculation engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustprop-core.workspace = true
rustprop-heos = { workspace = true, optional = true }
rustprop-data = { workspace = true, optional = true }
rustprop-cubics = { workspace = true, optional = true }
rustprop-if97 = { workspace = true, optional = true }
rustprop-incompressible = { workspace = true, optional = true }
rustprop-pcsaft = { workspace = true, optional = true }
rustprop-tabular = { workspace = true, optional = true }
rustprop-svdsbtl = { workspace = true, optional = true }
rustprop-humid-air = { workspace = true, optional = true }

[features]
default = []
heos = ["dep:rustprop-heos", "dep:rustprop-data"]
# Mixture support (binary-pair + departure-function tables are a separate
# data block; apps that only need pure fluids should not carry them).
heos-mixtures = ["heos", "rustprop-data/mixture-data"]
cubics = ["dep:rustprop-cubics", "dep:rustprop-data", "rustprop-data/cubic-fluids"]
if97 = ["dep:rustprop-if97"]
incompressible = ["dep:rustprop-incompressible", "dep:rustprop-data", "rustprop-data/incompressible-fluids"]
pcsaft = ["dep:rustprop-pcsaft"]
tabular = ["dep:rustprop-tabular"]
svdsbtl = ["dep:rustprop-svdsbtl"]
humid-air = ["dep:rustprop-humid-air", "dep:rustprop-data", "rustprop-data/water", "rustprop-data/air"]
all-backends = [
    "heos",
    "heos-mixtures",
    "rustprop-data/all-fluids",
    "cubics",
    "if97",
    "incompressible",
    "pcsaft",
    "tabular",
    "svdsbtl",
    "humid-air",
]

[lints]
workspace = true
