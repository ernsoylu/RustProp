[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tests/*", "tools/*"]
exclude = [
    "tools/golden-gen",
    "tools/if97-extract", # Python tooling, not crates
    "tools/perf-bench",   # standalone timing harness, not shipped
    "tests/wasm-smoke",   # Node smoke test for the wasm-pack output
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains (e.g. rustprop-heos flash_hs) stabilized in 1.88; CI checks it.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ernsoylu/RustProp"
# Cargo adjusts the workspace-relative path per inheriting crate, so every
# published crate ships the root README.
readme = "README.md"
keywords = ["thermodynamics", "coolprop", "properties", "wasm", "eos"]
categories = ["science", "mathematics", "wasm"]

[workspace.dependencies]
rustprop-core = { path = "crates/rustprop-core", version = "0.1.0" }
rustprop-data = { path = "crates/rustprop-data", version = "0.1.0" }
rustprop-heos = { path = "crates/rustprop-heos", version = "0.1.0" }
rustprop-cubics = { path = "crates/rustprop-cubics", version = "0.1.0" }
rustprop-if97 = { path = "crates/rustprop-if97", version = "0.1.0" }
rustprop-incompressible = { path = "crates/rustprop-incompressible", version = "0.1.0" }
rustprop-pcsaft = { path = "crates/rustprop-pcsaft", version = "0.1.0" }
rustprop-tabular = { path = "crates/rustprop-tabular", version = "0.1.0" }
rustprop-svdsbtl = { path = "crates/rustprop-svdsbtl", version = "0.1.0" }
rustprop-humid-air = { path = "crates/rustprop-humid-air", version = "0.1.0" }
rustprop = { path = "crates/rustprop", version = "0.1.0" }
# Test/dev tooling only — JSON parsing must stay out of shipped binaries (PLAN.md).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Declaring MSRV 1.88 makes clippy propose collapsing nested `if let` + `if`
# into let-chains at 18 sites; the nested shape deliberately mirrors upstream
# C++ control flow (a fidelity/review aid), so the suggestion is refused.
collapsible_if = "allow"

# Size/perf profile for release artifacts (native CLI and wasm alike).
# opt-level stays 3: property calculations are compute-heavy; use wasm-opt -Oz
# on emitted .wasm files when size matters more than speed.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The profile the C/C++ artifacts are built with: `release` in every respect
# that touches the numbers, but unwinding.
#
# `panic = "abort"` is right for wasm — there is no host process to protect,
# and abort is smaller. It is wrong for a shared library loaded into somebody
# else's application, where a panic would take the host down with it and the
# `catch_unwind` at each `extern "C"` entry point (rustprop-capi) could never
# run. Nothing else changes, so a value computed here is the value the
# `release` profile computes.
[profile.release-capi]
inherits = "release"
panic = "unwind"
