[package]
name = "rustprop-wasm-size-probe"
description = "Minimal cdylib whose compiled .wasm size CI reports per feature set"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustprop.workspace = true
rustprop-core.workspace = true
rustprop-heos = { workspace = true, optional = true }
rustprop-data = { workspace = true, optional = true }
rustprop-svdsbtl = { workspace = true, optional = true }

[features]
default = []
if97 = ["rustprop/if97"]
heos-data = ["rustprop/heos", "dep:rustprop-heos", "dep:rustprop-data"]
heos-water = ["heos-data", "rustprop-data/water"]
heos-all-fluids = ["heos-data", "rustprop-data/all-fluids"]
# Mixture support on top of two fluids: the pair/departure-table data cost.
heos-mixtures = ["heos-data", "rustprop/heos-mixtures", "rustprop-data/methane", "rustprop-data/ethane"]
# The SVDSBTL EVALUATOR only — no HEOS, no coefficients. The surface
# artifacts are ingested data and are never linked by default (13.1 note).
svdsbtl = ["dep:rustprop-svdsbtl"]
cubics = ["rustprop/cubics"]
incompressible = ["rustprop/incompressible"]
humid-air = ["rustprop/humid-air"]
all-backends = ["if97", "heos-all-fluids", "heos-mixtures", "cubics", "incompressible", "humid-air", "rustprop/all-backends"]

[lints]
workspace = true
